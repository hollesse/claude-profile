[package]
name = "claude-profile"
version = "0.1.0"
edition = "2021"
description = "Separate Claude Code profiles (subscription / Vertex)"
license = "MIT"
repository = "https://github.com/hollesse/claude-profile"
homepage = "https://hollesse.github.io/claude-profile/"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false }
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
