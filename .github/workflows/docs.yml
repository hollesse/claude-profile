name: Docs

# Builds the mdBook in docs/ and publishes it to GitHub Pages.
#
# The published docs always describe a release: the release workflow calls this one with the
# new tag. A manual run republishes the docs of a tag you name (or of main, for a fix that
# should not wait for the next release).
on:
  workflow_call:
    inputs:
      ref:
        description: "Tag or branch to build the docs from"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build the docs from, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/configure-pages@v5
      - name: Build
        run: mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
